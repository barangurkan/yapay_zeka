<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geçmiş Kayıtlar - Kütüphane Doluluk Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .history-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .history-image {
            max-width: 100%;
            border-radius: 5px;
        }
        .stats-badge {
            font-size: 1.2em;
            padding: 8px 15px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Geçmiş Kayıtlar</h1>
        
        <div class="text-center mb-4">
            <a href="/" class="btn btn-primary">Ana Sayfa</a>
        </div>
        
        {% for record in records %}
        <div class="history-card">
            <div class="row">
                <div class="col-md-4">
                    <img src="{{ record.image_path }}" class="history-image" alt="Kayıt görüntüsü">
                </div>
                <div class="col-md-8">
                    <h3>Kayıt Tarihi: {{ record.timestamp.strftime('%d.%m.%Y %H:%M') }}</h3>
                    <div class="mt-3">
                        <span class="badge bg-primary stats-badge">Oturan: {{ record.sitting_count }}</span>
                        <span class="badge bg-info stats-badge">Toplam Kişi: {{ record.total_people }}</span>
                        <span class="badge bg-success stats-badge">Toplam Sandalye: {{ record.total_chairs }}</span>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
